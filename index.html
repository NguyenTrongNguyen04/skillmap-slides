:-.055em;font-weight:600;margin-bottom:25px}.muted{font-size:clamp(13px,1.1vw,16px);color:var(--muted);margin-top:20px!important}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin:20px 0}.mini{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:23px 25px;display:flex;flex-direction:column;gap:9px;min-height:115px;box-shadow:var(--shadow)}.mini strong{font-size:clamp(17px,1.55vw,23px);line-height:1.2;letter-spacing:-.025em}.mini span{font-size:clamp(13px,1.13vw,16px);line-height:1.55;color:#59605b}.bullets{margin:10px 0;padding-left:1.25em}.bullets li{margin:0 0 14px;padding-left:8px}.bullets li::marker{color:var(--accent)}.split{display:grid;grid-template-columns:1.08fr 1fr;gap:clamp(22px,4vw,65px);align-items:start}.split>div{min-width:0}.code{margin:8px 0 20px;background:#202522;color:#e8f0e9;border-radius:14px;padding:clamp(20px,2.4vw,34px);overflow:auto;font:clamp(13px,1.18vw,18px)/1.72 'DM Mono',monospace;box-shadow:0 18px 45px #16241b16;white-space:pre}.content code:not(.code code){font-family:'DM Mono',monospace;background:#e9ece8;padding:.12em .3em;border-radius:4px;font-size:.85em}.pipeline{display:flex;gap:9px;align-items:stretch;margin:22px 0;flex-wrap:wrap}.node{flex:1 1 130px;min-width:125px;position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;padding:17px 16px;display:flex;flex-direction:column;gap:8px}.node:not(:last-child):after{content:'→';position:absolute;right:-14px;top:45%;z-index:2;color:var(--accent);background:var(--bg);padding:0 2px}.node-num{font:11px 'DM Mono',monospace;color:var(--accent)}.node b{font-size:clamp(14px,1.3vw,19px);line-height:1.3}.node small{color:var(--muted);font-size:clamp(12px,.95vw,14px);line-height:1.5}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1000px}.statgrid>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 28px;display:flex;flex-direction:column;gap:6px}.statgrid em{font-style:normal;font-size:clamp(42px,5.4vw,83px);font-weight:600;line-height:1;letter-spacing:-.07em}.statgrid span{font-size:clamp(13px,1.15vw,17px);color:var(--muted)}.stack{display:flex;width:100%;height:19px;overflow:hidden;border-radius:99px;margin:24px 0}.stack i{height:100%;display:block}.bars{display:flex;flex-direction:column;gap:17px;margin:16px 0 25px}.barrow{display:grid;grid-template-columns:minmax(140px,220px) 1fr 78px;align-items:center;gap:22px;font-size:clamp(14px,1.2vw,18px)}.barrow span{font-weight:550}.barrow b{text-align:right;font:500 clamp(13px,1.12vw,17px) 'DM Mono',monospace}.track{height:18px;background:#e5eae5;border-radius:5px;overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:5px;transition:width 1.1s cubic-bezier(.15,.8,.2,1) .28s}.active .track i{width:var(--v)}.formula{display:flex;align-items:center;gap:24px;flex-wrap:wrap;font-size:clamp(23px,3.1vw,45px);letter-spacing:-.04em;font-weight:600;margin:38px 0}.fraction{display:inline-flex;flex-direction:column;text-align:center;font-size:.7em;line-height:1.45}.fraction span:first-child{border-bottom:2px solid;padding:0 12px 10px}.fraction span:last-child{padding:10px 12px 0}.formulas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.formulas>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:25px;display:flex;flex-direction:column;gap:16px}.formulas strong{font-size:23px}.formulas span{font:500 clamp(19px,2vw,30px) 'DM Mono',monospace;color:var(--accent)}.formulas small{font-size:14px;line-height:1.6;color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;margin:22px 0}table{width:100%;border-collapse:collapse;font-size:clamp(14px,1.2vw,18px)}th,td{text-align:left;padding:16px 21px;border-bottom:1px solid var(--line)}th{background:#eef1ec;font-weight:600}tr:last-child td{border-bottom:0}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px}.chips span{border:1px solid #cfd5cf;border-radius:99px;padding:8px 15px;font-size:12px;font-weight:600;color:#515b54}.footer{position:absolute;bottom:28px;left:clamp(30px,7vw,120px);right:clamp(30px,7vw,120px);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:12px 'DM Mono',monospace;pointer-events:none}.controls{position:fixed;bottom:20px;right:24px;display:flex;gap:8px;z-index:20}.controls button,.overview button{cursor:pointer;border:1px solid #cfd5ce;background:#fff;border-radius:9px;min-width:41px;height:41px;color:#252c27;font-size:18px;transition:background .2s,transform .2s}.controls button:hover,.overview button:hover{background:#e8f0eb;transform:translateY(-2px)}.controls button:focus-visible,.overview button:focus-visible{outline:3px solid #79a994}.overview{position:fixed;inset:0;z-index:50;background:rgba(18,25,20,.92);color:#fff;display:none;padding:45px;overflow:auto;backdrop-filter:blur(15px)}.overview.open{display:block}.overview h2{font-size:30px;letter-spacing:-.04em;margin:0 0 25px}.overviewgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.overviewitem{border:1px solid #ffffff35;border-radius:12px;padding:18px;cursor:pointer;min-height:120px;transition:background .2s,transform .2s}.overviewitem:hover{background:#ffffff16;transform:translateY(-3px)}.overviewitem small{color:#9db4a7;display:block;margin-bottom:15px}.overviewitem b{font-size:17px}.overviewclose{position:fixed;top:28px;right:35px}.hint{position:fixed;top:18px;right:28px;z-index:2;color:#858e87;font:11px 'DM Mono',monospace}@media(max-width:800px){.slide{padding:25px 25px 90px}.topline{margin-bottom:24px}.split{grid-template-columns:1fr}.content{font-size:16px}.slide h1{font-size:36px}.slide.cover h1{font-size:64px}.node{flex-basis:42%}.statgrid{gap:8px}.statgrid>div{padding:18px}.formulas{grid-template-columns:1fr}.barrow{grid-template-columns:115px 1fr 60px;gap:8px;font-size:12px}.track{height:13px}.footer{left:25px;right:25px;bottom:22px}.controls{bottom:12px;right:12px}.controls button{height:36px;min-width:36px}.hint{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}@media print{body{overflow:visible;background:white}.deck{height:auto;overflow:visible}.slide{position:relative;opacity:1;transform:none!important;pointer-events:auto;min-height:100vh;break-after:page;page-break-after:always}.controls,.hint,.overview{display:none!important}.track i{width:var(--v)!important}}

const slides=[{"kind": "cover", "title": "SkillMap", "body": "<div class=\"hero-line\">Từ dữ liệu tuyển dụng<br>đến bản đồ kỹ năng.<\/div><p class=\"lede\">Giải mã từng bước notebook Python — dễ hiểu ngay cả khi bạn chưa từng viết code.<\/p><div class=\"chips\"><span>172 bản ghi<\/span><span>19 cột<\/span><span>33 ô notebook<\/span><span>14 phần<\/span><\/div>", "eyebrow": "KHÓA HỌC TƯƠNG TÁC · 2026", "note": ""}, {"kind": "statement", "title": "Học để hiểu. Không học thuộc.", "body": "<p>Mục tiêu của bộ slide là trả lời ba câu hỏi ở mỗi bước: <b>Code nhận gì?<\/b> · <b>Code làm gì?<\/b> · <b>Code trả ra gì?<\/b><\/p><div class=\"cards\"><div class=\"mini\"><strong>01 / Trực giác<\/strong><span>Ví dụ đời thường trước khi nhìn code.<\/span><\/div><div class=\"mini\"><strong>02 / Cú pháp<\/strong><span>Tách từng dòng và từng ký hiệu.<\/span><\/div><div class=\"mini\"><strong>03 / Kiểm chứng<\/strong><span>Đối chiếu với dữ liệu và kết quả thực.<\/span><\/div><\/div>", "eyebrow": "CÁCH HỌC", "note": ""}, {"kind": "agenda", "title": "Lộ trình 8 chương", "body": "<div class=\"pipeline\"><div class=\"node\"><span class=\"node-num\">01<\/span><b>Bối cảnh<\/b><small>CSV, tin tuyển dụng<\/small><\/div><div class=\"node\"><span class=\"node-num\">02<\/span><b>Python căn bản<\/b><small>Biến, hàm, vòng lặp<\/small><\/div><div class=\"node\"><span class=\"node-num\">03<\/span><b>Làm sạch<\/b><small>Unicode, ID, URL<\/small><\/div><div class=\"node\"><span class=\"node-num\">04<\/span><b>Phạm vi<\/b><small>Vai trò và kinh nghiệm<\/small><\/div><div class=\"node\"><span class=\"node-num\">05<\/span><b>Kỹ năng<\/b><small>Regex và evidence<\/small><\/div><div class=\"node\"><span class=\"node-num\">06<\/span><b>Thống kê<\/b><small>Mention rate và cặp<\/small><\/div><div class=\"node\"><span class=\"node-num\">07<\/span><b>Đánh giá<\/b><small>Gold labels, F1<\/small><\/div><div class=\"node\"><span class=\"node-num\">08<\/span><b>Xuất dữ liệu<\/b><small>Báo cáo, website<\/small><\/div><\/div>", "eyebrow": "BẢN ĐỒ BÀI HỌC", "note": ""}, {"kind": "section", "title": "01 / Hiểu dữ liệu", "body": "<p class=\"lede\">Trước khi đọc thuật toán, hãy hiểu chính xác dữ liệu đang nói về điều gì.<\/p>", "eyebrow": "CHƯƠNG 01", "note": ""}, {"kind": "text", "title": "SkillMap giải quyết bài toán nào?", "body": "<p>Các tin tuyển dụng chứa thông tin về kỹ năng, công cụ, kinh nghiệm và vai trò. SkillMap tổ chức các thông tin đó thành dữ liệu có thể tìm kiếm, thống kê và đối chiếu.<\/p><div class=\"cards\"><div class=\"mini\"><strong>Đầu vào<\/strong><span>Thông tin tuyển dụng TopCV đã xử lý.<\/span><\/div><div class=\"mini\"><strong>Xử lý<\/strong><span>Lọc, chuẩn hóa, nhận diện kỹ năng.<\/span><\/div><div class=\"mini\"><strong>Đầu ra<\/strong><span>Tần suất, báo cáo, dữ liệu cho website.<\/span><\/div><\/div>", "eyebrow": "BỨC TRANH TOÀN CẢNH", "note": ""}, {"kind": "metrics", "title": "Dataset đầu vào", "body": "<div class=\"statgrid\"><div><em>172<\/em><span>Tin tuyển dụng<\/span><\/div><div><em>19<\/em><span>Cột thông tin<\/span><\/div><div><em>0<\/em><span>Hàng trùng hoàn toàn<\/span><\/div><div><em>87<\/em><span>Giá trị thiếu ở date_posted<\/span><\/div><\/div><p class=\"muted\">Các số liệu trên được kiểm tra từ file CSV tải lên.<\/p>", "eyebrow": "DỮ LIỆU THỰC TẾ", "note": ""}, {"kind": "text", "title": "Một hàng trong CSV nghĩa là gì?", "body": "<p>Một hàng tương ứng với <b>một bản ghi tuyển dụng<\/b>, không phải một ứng viên và cũng không phải một kỹ năng.<\/p><div class=\"split\"><div><div class=\"cards\"><div class=\"mini\"><strong>title_raw<\/strong><span>Tên vị trí tuyển dụng<\/span><\/div><div class=\"mini\"><strong>company_raw<\/strong><span>Tên doanh nghiệp<\/span><\/div><div class=\"mini\"><strong>experience_raw<\/strong><span>Yêu cầu kinh nghiệm<\/span><\/div><\/div><\/div><div><div class=\"cards\"><div class=\"mini\"><strong>candidate_requirements_raw<\/strong><span>Yêu cầu ứng viên<\/span><\/div><div class=\"mini\"><strong>job_description_raw<\/strong><span>Mô tả công việc<\/span><\/div><div class=\"mini\"><strong>source_job_id<\/strong><span>Mã tin từ nguồn<\/span><\/div><\/div><\/div><\/div>", "eyebrow": "TƯ DUY DỮ LIỆU", "note": ""}, {"kind": "text", "title": "CSV giống một bảng Excel", "body": "<p>Mỗi <b>hàng<\/b> là một tin tuyển dụng. Mỗi <b>cột<\/b> là một thuộc tính. CSV lưu bảng dưới dạng văn bản.<\/p><div class=\"tablewrap\"><table><thead><tr><th>title_raw<\/th><th>location_raw<\/th><th>experience_raw<\/th><\/tr><\/thead><tbody><tr><td>AI Engineer<\/td><td>Hà Nội<\/td><td>1 năm<\/td><\/tr><tr><td>AI Camera Engineer<\/td><td>TP.HCM<\/td><td>2 năm<\/td><\/tr><\/tbody><\/table><\/div><p class=\"muted\">Bảng rút gọn để minh họa cấu trúc.<\/p>", "eyebrow": "DỮ LIỆU DẠNG BẢNG", "note": ""}, {"kind": "text", "title": "Hai cột văn bản quan trọng nhất", "body": "<div class=\"cards\"><div class=\"mini\"><strong>candidate_requirements_raw<\/strong><span>Ứng viên cần có gì? Đây là nơi có nhiều yêu cầu kỹ năng.<\/span><\/div><div class=\"mini\"><strong>job_description_raw<\/strong><span>Người được tuyển sẽ làm gì? Công nghệ có thể được nhắc đến trong mô tả.<\/span><\/div><\/div><p><b>Cẩn thận:<\/b> Một công nghệ được nhắc đến chưa chắc là điều kiện bắt buộc.<\/p>", "eyebrow": "ĐỌC ĐÚNG NGỮ CẢNH", "note": ""}, {"kind": "section", "title": "02 / Python từ con số 0", "body": "<p class=\"lede\">Một số ký hiệu nhỏ, nhưng đủ để đọc phần lớn notebook.<\/p>", "eyebrow": "CHƯƠNG 02", "note": ""}, {"kind": "code", "title": "Import = mở hộp dụng cụ", "body": "<div class=\"split\"><div><pre class=\"code\"><code>import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt<\/code><\/pre><\/div><div><ul class=\"bullets\"><li><code>pandas<\/code>: làm việc với bảng.<\/li><li><code>numpy<\/code>: tính toán số.<\/li><li><code>matplotlib<\/code>: vẽ biểu đồ.<\/li><li><code>as pd<\/code>: đặt tên ngắn để gõ nhanh.<\/li><\/ul><\/div><\/div>", "eyebrow": "CELL 2 · THƯ VIỆN", "note": ""}, {"kind": "code", "title": " false);return}if(overview.classList.contains('open'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key.toLowerCase()==='o')toggleOverview();if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});let touchX=null;deck.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});deck.addEventListener('touchend',e=>{if(touchX===null)return;let d=e.changedTouches[0].screenX-touchX;if(Math.abs(d)>85)show(current+(d<0?1:-1));touchX=null},{passive:true});window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(Number.isFinite(n))show(n-1)});show(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
